tab_bar_style separator
tab_separator ""
tab_bar_min_tabs 1

tab_title_template "{fmt.fg.white}{fmt.bg.black}{index:}{fmt.fg.default}{fmt.bg.default} {title} | "
active_tab_title_template "{fmt.fg.black}{fmt.bg.white}{index:}{fmt.fg.default}{fmt.bg.default} {title} | "

active_tab_font_style normal

enabled_layouts splits, *

map alt+v launch --location=vsplit --cwd=current
map alt+s launch --location=hsplit --cwd=current

map alt+t new_tab

map alt+left  neighboring_window left
map alt+right neighboring_window right
map alt+up    neighboring_window up
map alt+down  neighboring_window down
map alt+h     neighboring_window left
map alt+l     neighboring_window right
map alt+k     neighboring_window up
map alt+j     neighboring_window down

map alt+shift+left  kitten resize_dir.py left 4
map alt+shift+right kitten resize_dir.py right 4
map alt+shift+up    kitten resize_dir.py up 4
map alt+shift+down  kitten resize_dir.py down 4

map alt+shift+h kitten resize_dir.py left 4
map alt+shift+l kitten resize_dir.py right 4
map alt+shift+k kitten resize_dir.py up 4
map alt+shift+j kitten resize_dir.py down 4

map ctrl+alt+shift+left  move_window left
map ctrl+alt+shift+right move_window right
map ctrl+alt+shift+up    move_window up
map ctrl+alt+shift+down  move_window down

map ctrl+alt+shift+h move_window left
map ctrl+alt+shift+l move_window right
map ctrl+alt+shift+k move_window up
map ctrl+alt+shift+j move_window down

map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9
map alt+0 goto_tab 10

map alt+shift+1 detach_window --target-tab 1
map alt+shift+2 detach_window --target-tab 2
map alt+shift+3 detach_window --target-tab 3
map alt+shift+4 detach_window --target-tab 4
map alt+shift+5 detach_window --target-tab 5
map alt+shift+6 detach_window --target-tab 6
map alt+shift+7 detach_window --target-tab 7
map alt+shift+8 detach_window --target-tab 8
map alt+shift+9 detach_window --target-tab 9
map alt+shift+0 detach_window --target-tab 10

map ctrl+plus change_font_size current +1.0
map ctrl+minus change_font_size current -1.0
