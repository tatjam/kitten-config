font_family      Cascadia Code PL
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        14
adjust_line_height 120%

hide_window_decorations yes

enable_audio_bell no
visual_bell_duration 0

mouse_hide_wait 0
# copy_on_select yes
strip_trailing_spaces smart

scrollback_lines 50000
scrollback_pager ~/.config/kitty/helix_pager.py
map alt+u show_scrollback

map ctrl+shift+p>l kitten hints --type line --program @
map ctrl+shift+p>w kitten hints --type word --program @
map ctrl+shift+p>f kitten hints --type path --program @
map ctrl+shift+p>u kitten hints --type url --program @

map ctrl+shift+u kitten unicode_input --tab name

map ctrl+shift+' command_palette 

shell_integration enabled

# So helix can spawn commands, example
# C-g = ":sh kitty @ launch --type=overlay --cwd=current lazygit"

allow_remote_control yes

include theme.conf
include tabs.conf


# BEGIN_KITTY_THEME
# Catppuccin-Macchiato
include current-theme.conf
# END_KITTY_THEME